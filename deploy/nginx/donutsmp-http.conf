# DonutSMP Transaction Tracker - plain HTTP reverse proxy.
#
# Use this when the dashboard has no domain yet and is reached by IP address.
# The session cookie works over HTTP, but it is sent unencrypted, so treat the
# sign-in as convenience-only until you can put HTTPS in front of it. Once DNS
# points at the box, switch to donutsmp.conf and run certbot.
#
# This block deliberately does NOT declare `default_server`: on a shared server
# another site usually owns the port-80 catch-all, and only one block may claim
# it. Instead the exact IP is matched via server_name, so unknown hosts keep
# going to whatever else owns the catch-all. __SERVER_NAME__ is replaced with
# VPS_HOSTNAME by deploy/vps-setup.sh.
#
# Install to /etc/nginx/sites-available/donutsmp.conf and symlink into
# sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    server_tokens off;

    root /opt/donutsmp-tracker/frontend/dist;
    index index.html;

    # Bulk uploads drain the mod's offline queue in one request.
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No HSTS and no upgrade-insecure-requests here: this block is plain HTTP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://mc-heads.net https://minotar.net; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    include /etc/nginx/snippets/donutsmp-security.conf;

    # The bootstrap endpoint reveals the API key and is loopback-only anyway.
    location = /api/bootstrap {
        return 403;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:18700;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # No add_header here on purpose: declaring one would drop the server-level
    # security headers for this location. `expires` sets Cache-Control by itself.
    location /assets/ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
