# HTTPS deployment for a real domain. deploy/vps-setup.sh substitutes
# tracker.example.com with VPS_HOSTNAME and installs this as
# /etc/nginx/sites-available/donutsmp.conf.
#
# Requires an existing Let's Encrypt certificate for the domain: vps-setup.sh
# obtains it before installing this file, so nginx -t never sees a missing
# certificate.

server {
    listen 80;
    listen [::]:80;
    server_name tracker.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tracker.example.com;

    ssl_certificate     /etc/letsencrypt/live/tracker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Do not advertise the nginx version.
    server_tokens off;

    root /opt/donutsmp-tracker/frontend/dist;
    index index.html;

    # Bulk uploads drain the mod's offline queue in one request.
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # HSTS: only on the real HTTPS host. No includeSubDomains, so sibling
    # subdomains of asifent.com that are not HTTPS-ready are unaffected.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # The SPA loads Roboto / Material Symbols from Google Fonts and player
    # avatars from mc-heads.net and minotar.net; everything else is same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://mc-heads.net https://minotar.net; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    include /etc/nginx/snippets/donutsmp-security.conf;

    # The bootstrap endpoint reveals the API key and is loopback-only anyway.
    location = /api/bootstrap {
        return 403;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:18700;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # No add_header here on purpose: declaring one would drop the server-level
    # security headers for this location. `expires` sets Cache-Control by itself.
    location /assets/ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
