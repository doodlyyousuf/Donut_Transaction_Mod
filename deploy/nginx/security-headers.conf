# Security headers shared by the DonutSMP Tracker server blocks.
#
# Included by deploy/vps-setup.sh into the nginx site config so every response
# (static, proxied API, error pages) carries the same hardening. Referenced as
# /etc/nginx/snippets/donutsmp-security.conf.
#
# Content-Security-Policy and Strict-Transport-Security are added by each site
# config separately: the plain-HTTP test block must not send HSTS or
# upgrade-insecure-requests.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
