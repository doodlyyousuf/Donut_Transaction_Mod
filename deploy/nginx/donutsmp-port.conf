# DonutSMP Transaction Tracker - dedicated-port reverse proxy (no domain, no TLS).
#
# Instead of claiming port 80 and serving the SPA at "/", this block listens on
# its own high port (default 18701) and is reached as http://<ip>:<port>/.
# That keeps the test instance completely clear of any real site that already
# owns port 80.
#
# Only the frontend port is public. The API stays on 127.0.0.1:18700 and is
# reached through this same origin via /api and /ws, so there is no CORS to
# configure and the session cookie remains first-party.
#
# The listen port and server name below are substituted by deploy/vps-setup.sh
# from VPS_FRONTEND_PORT and VPS_HOSTNAME. Install to
# /etc/nginx/sites-available/donutsmp.conf and symlink into sites-enabled.

server {
    listen __FRONTEND_PORT__;
    listen [::]:__FRONTEND_PORT__;
    server_name __SERVER_NAME__;

    server_tokens off;

    root /opt/donutsmp-tracker/frontend/dist;
    index index.html;

    # Bulk uploads drain the mod's offline queue in one request.
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No HSTS and no upgrade-insecure-requests here: this block is plain HTTP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://mc-heads.net https://minotar.net; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    include /etc/nginx/snippets/donutsmp-security.conf;

    # The bootstrap endpoint reveals the API key and is loopback-only anyway.
    location = /api/bootstrap {
        return 403;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:18700;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # No add_header here on purpose: declaring one would drop the server-level
    # security headers for this location. `expires` sets Cache-Control by itself.
    location /assets/ {
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
