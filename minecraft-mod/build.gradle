plugins {
    id 'fabric-loom' version '1.14.10'
    id 'java'
}

// 1.21.x build. The 26.1.x line has its own build in ./mc26 (modern Loom, no
// mappings, official class names) — see README "Building for both lines".

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Gson ships with Minecraft

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    // Gradle 9+ needs the launcher on the test runtime classpath
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The 1.21.x client/UI glue lives in src/yarn/java (yarn class names).
sourceSets.main.java.srcDir 'src/yarn/java'

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "java_depends", project.java_depends
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version,
               "java_depends": project.java_depends
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

test {
    useJUnitPlatform()
}
